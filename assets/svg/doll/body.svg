<svg xmlns="http://www.w3.org/2000/svg" width="200" height="400" viewBox="0 0 200 400">
  <defs>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7A4A6A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7A4A6A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F6C4AA"/>
      <stop offset="0.45" stop-color="#FFE6D6"/>
      <stop offset="1" stop-color="#F3BDA2"/>
    </linearGradient>
    <linearGradient id="torso" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4C0A5"/>
      <stop offset="0.5" stop-color="#FFE3D2"/>
      <stop offset="1" stop-color="#F2BBA0"/>
    </linearGradient>
    <linearGradient id="neck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDB397"/>
      <stop offset="0.6" stop-color="#FFDCC8"/>
    </linearGradient>
    <linearGradient id="leo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F3DDEA"/>
      <stop offset="0.45" stop-color="#FFFBFD"/>
      <stop offset="1" stop-color="#EFD6E5"/>
    </linearGradient>
  </defs>
  <!-- floor shadow -->
  <ellipse cx="100" cy="366" rx="56" ry="11" fill="url(#shadow)"/>
  <!-- legs -->
  <rect x="84" y="236" width="13.5" height="122" rx="6.75" fill="url(#leg)" stroke="#DE9F84" stroke-width="1.6"/>
  <rect x="102.5" y="236" width="13.5" height="122" rx="6.75" fill="url(#leg)" stroke="#DE9F84" stroke-width="1.6"/>
  <path d="M86.5 300 q4 3 8 0 M105 300 q4 3 8 0" fill="none" stroke="#E9AE93" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <!-- feet -->
  <ellipse cx="86" cy="358" rx="11.5" ry="6.5" fill="#FFDCC8" stroke="#DE9F84" stroke-width="1.6"/>
  <ellipse cx="114" cy="358" rx="11.5" ry="6.5" fill="#FFDCC8" stroke="#DE9F84" stroke-width="1.6"/>
  <!-- neck -->
  <rect x="93" y="146" width="14" height="28" rx="6" fill="url(#neck)" stroke="#DE9F84" stroke-width="1.6"/>
  <!-- torso -->
  <path d="M86 166 Q74 167 73.5 178 L79 222 Q76.5 236 77.5 250 L122.5 250 Q123.5 236 121 222 L126.5 178 Q126 167 114 166 Q100 172 86 166 Z" fill="url(#torso)" stroke="#DE9F84" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- cute base romper -->
  <path d="M79.5 198 L82 172 L89.5 172 Q100 186 110.5 172 L118 172 L120.5 198 L120 222 Q123 238 124 253 Q112 259 100.5 252 Q99.5 251 99.5 252 Q88 259 76 253 Q77 238 80 222 Z" fill="url(#leo)" stroke="#D9B3C8" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- lace trim -->
  <g fill="#FFFFFF" stroke="#E5C3D6" stroke-width="1">
    <circle cx="79" cy="254" r="2.6"/><circle cx="84.5" cy="256" r="2.6"/><circle cx="90" cy="256.5" r="2.6"/><circle cx="95.5" cy="254.5" r="2.6"/>
    <circle cx="104.5" cy="254.5" r="2.6"/><circle cx="110" cy="256.5" r="2.6"/><circle cx="115.5" cy="256" r="2.6"/><circle cx="121" cy="254" r="2.6"/>
  </g>
  <path d="M100 186 Q100 214 100 250" stroke="#EBCFDD" stroke-width="1.2" fill="none" opacity="0.8"/>
  <!-- tiny bow -->
  <path d="M100 181 L92.5 176.5 L92.5 185.5 Z M100 181 L107.5 176.5 L107.5 185.5 Z" fill="#FF9EC6" stroke="#E0789F" stroke-width="1" stroke-linejoin="round"/>
  <circle cx="100" cy="181" r="2.4" fill="#FFB8D6" stroke="#E0789F" stroke-width="1"/>
